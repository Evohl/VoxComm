[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcomm"
version = "0.1.0"
description = "A modular local voice and communications copilot for Linux"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.27",
  "ddgs>=9.0,<10",
  "sounddevice>=0.5",
  "numpy>=2.0",
]

[project.optional-dependencies]
input = ["evdev>=1.7; sys_platform == 'linux'", "pynput>=1.7"]
dev = ["pytest>=8.0"]

[project.scripts]
voxcomm = "voxcomm.app:main"
voxcomm-mangohud-status = "voxcomm.mangohud:main"

[tool.setuptools.packages.find]
where = ["src"]
